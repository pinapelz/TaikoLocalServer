name: TLS GitHub Actions
run-name: Publish TLS executable program 🚀
on: [push]
env:
  Major_Version_Number: '1'
  Minor_Version_Number: '1'
  Build_Number: ${{ github.run_number }}
jobs:
  TLS-GitHub-Actions:
    runs-on: windows-latest
    steps:
      - run: echo "🎉 The job was automatically triggered by a ${{ github.event_name }} event. Commiter is ${{ github.actor }}."
      - run: echo "🐧 This job is now running on a ${{ runner.os }} server hosted by GitHub!"
      - run: echo "🔎 The name of your branch is ${{ github.ref }} and your repository is ${{ github.repository }}."
      

      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore workloads
        run: dotnet workload restore

      - name: Publish for Linux ARM64
        run: dotnet publish TaikoLocalServer/TaikoLocalServer.csproj -c Release -r linux-arm64 --self-contained true /p:IncludeNativeLibrariesForSelfExtract=true

      - name: Upload ARM64 build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TLS-${{ env.Major_Version_Number }}.${{ env.Minor_Version_Number }}.${{ env.Build_Number }}-linux-arm64
          path: ${{ github.workspace }}/TaikoLocalServer/bin/Release/net8.0/linux-arm64/publish
          include-hidden-files: true
